<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Colocaciones de SOFIA — ABSTORAGES</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/corporate.css">
<script src="/js/shell.js"></script>
<style>
.page-w { max-width:1100px; margin:0 auto; padding:24px 28px 56px; }
.bar { margin-bottom:18px; }
.card { background:var(--surface); border:1px solid var(--bd); border-radius:14px; padding:22px 24px; margin-bottom:16px; box-shadow:var(--shadow-1); }
.card-h { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
.card h3 { font-size:17px; font-weight:800; letter-spacing:-.01em; }
.sub { font-size:13px; color:var(--tx2); margin-top:3px; }
.tag { font-size:10.5px; font-weight:700; padding:4px 11px; border-radius:20px; text-transform:uppercase; letter-spacing:.06em; }
.t-buscando { background:var(--acc-soft); color:var(--acc-tx); } .t-colocado { background:var(--ok-soft); color:var(--ok); } .t-sin_unidad { background:var(--crit-soft); color:var(--crit); }
.tbl-w { overflow-x:auto; margin-top:16px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; color:var(--tx3); font-size:11px; text-transform:uppercase; letter-spacing:.07em; padding:9px 12px; font-weight:700; border-bottom:1px solid var(--bd); white-space:nowrap; }
td { padding:12px; border-bottom:1px solid var(--bd); vertical-align:top; }
tr:last-child td { border-bottom:none; }
tr.rec td { background:var(--ok-soft); }
tr.rec td:first-child { border-radius:10px 0 0 10px; } tr.rec td:last-child { border-radius:0 10px 10px 0; }
.line { font-size:13px; color:var(--tx2); margin-top:14px; line-height:1.6; }
.win { margin-top:16px; padding:14px 16px; background:var(--ok-soft); border-radius:12px; font-size:14px; }
.man { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; padding-top:16px; border-top:1px solid var(--bd); }
.man input { flex:1; min-width:220px; background:var(--surface); border:1px solid var(--bd-strong); border-radius:9px; padding:9px 12px; color:var(--tx); font-size:13.5px; font-family:inherit; }
.man input:focus { outline:none; border-color:var(--acc); box-shadow:var(--focus); }
.kpi { white-space:pre-wrap; font-family:var(--font-mono); font-size:14px; line-height:1.9; background:var(--surface-2); border:1px solid var(--bd); border-radius:12px; padding:18px 20px; margin-top:12px; }
@media (max-width:640px) { .page-w { padding:20px 16px 48px; } .card { padding:18px; } }
</style>
</head>
<body data-shell-title="Colocaciones de SOFIA">
<main class="page-w">
  <div class="crumbs"><a href="/">Portal</a><span>/</span><span>Colocaciones</span></div>
  <div class="page-head">
    <div>
      <h1>Colocaciones de SOFIA</h1>
      <p>Ofertas por servicio, recomendación y aprobación. SOFIA no asigna sola: la decisión final es tuya.</p>
    </div>
  </div>
  <div class="bar">
    <div class="seg" id="segF" style="max-width:640px">
      <div class="filter on" data-f="buscando">En búsqueda</div>
      <div class="filter" data-f="colocado">Colocados</div>
      <div class="filter" data-f="sin_unidad">Sin unidad</div>
      <div class="filter" data-f="ranking">Ranking</div>
      <div class="filter" data-f="kpis">KPIs</div>
    </div>
  </div>
  <div id="cont"><div class="empty-msg">Cargando…</div></div>
</main>
<script>
let filtro = 'buscando', datos = [];
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const $ = n => '$' + Number(n).toLocaleString('es-MX');
const hora = iso => iso ? new Date(iso).toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }) : '—';
const ESTADO = { esperando:'esperando', respondio:'respondió', acepto:'tiene unidad', rechazo:'no tiene', sin_respuesta:'sin respuesta' };
const SEG = { pendiente:'por preguntar', consultado:'preguntado, esperando', salio:'salió', en_ruta:'en ruta', entregado:'entregado', retraso:'retraso', sin_confirmacion:'sin confirmar' };

async function api(url, opt) { const r = await fetch(url, { credentials:'include', ...opt }); const d = await r.json(); if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status)); return d; }

function tarjeta(c) {
  const provs = Object.values(c.proveedores || {});
  const comp = c.comparativo || [];
  const ofertas = comp.length ? `<div class="tbl-w"><table><tr><th>Proveedor</th><th>Precio</th><th>Unidad</th><th>Historial</th><th></th></tr>${comp.map(f => `
    <tr class="${f.recomendado ? 'rec' : ''}"><td><b>${esc(f.nombre)}</b>${f.recomendado ? ' <span class="tag t-colocado">Recomendado</span>' : ''}${f.notas ? `<div class="sub">${esc(f.notas)}</div>` : ''}</td>
    <td>${f.precio ? $(f.precio) : 'sin precio'}</td><td>${esc(f.unidad || '—')}</td>
    <td>${f.colocado} servicio(s)${f.medianaMin != null ? ` · responde en ~${f.medianaMin} min` : ''}${f.retraso ? ` · ${f.retraso} retraso(s)` : ''}</td>
    <td>${c.estado === 'buscando' ? `<button class="btn btn-primary btn-sm" onclick="aprobar('${esc(c.folio)}','${esc(f.tel)}','${esc(f.nombre)}',${f.precio || 0})">Aprobar y cerrar</button>` : ''}</td></tr>`).join('')}</table></div>` : '';
  const contactados = provs.length ? `<div class="line"><b>Contactados:</b> ${provs.map(p => `${esc(p.nombre)} (${ESTADO[p.estado] || p.estado}, ola ${p.ola})`).join(' · ')}</div>` : '';
  const pend = (c.pendientes || []).length ? `<div class="line"><b>En espera de la siguiente ola:</b> ${c.pendientes.map(p => esc(p.nombre)).join(', ')}</div>` : '';
  const ganador = c.ganador ? `<div class="win"><b>${esc(c.ganador.nombre)}</b>${c.ganador.precio ? ' a ' + $(c.ganador.precio) : ''} · aprobó ${esc(c.ganador.aprobadoPor || '—')} · ${hora(c.colocadoEn)}<div class="sub">Unidad: ${SEG[c.seguimiento?.estado] || '—'}${c.seguimiento?.detalle ? ' — ' + esc(c.seguimiento.detalle) : ''}</div></div>` : '';
  const manual = c.estado === 'buscando' ? `<div class="man"><input id="m-${esc(c.folio)}" placeholder="Colocar con otro proveedor (nombre)"><button class="btn btn-secondary btn-sm" onclick="manual('${esc(c.folio)}')">Colocar manualmente</button></div>` : '';
  return `<div class="card"><div class="card-h"><div><h3>${esc(c.folio)} · ${esc(c.origen)} → ${esc(c.destino)}</h3><div class="sub">${esc(c.empresa || '')} · ${esc(c.tipo_unidad || 'unidad por definir')} · creada ${hora(c.creada)}${c.urgente ? ' · urgente' : ''}</div></div><span class="tag t-${c.estado}">${c.estado.replace('_',' ')}</span></div>${ofertas}${contactados}${pend}${ganador}${manual}</div>`;
}

async function render() {
  const cont = document.getElementById('cont');
  try {
    if (filtro === 'ranking') {
      const r = await api('/api/proveedores/ranking');
      cont.innerHTML = r.length ? `<div class="card"><div class="tbl-w"><table><tr><th>#</th><th>Proveedor</th><th>Puntaje</th><th>Contactado</th><th>Respondió</th><th>Tiempo típico</th><th>Aceptó</th><th>Colocado</th><th>Retrasos</th></tr>${r.map((p, i) => `<tr><td>${i+1}</td><td><b>${esc(p.nombre)}</b></td><td>${(p.puntaje*100).toFixed(0)}</td><td>${p.contactado}</td><td>${p.respondio}</td><td>${p.medianaMin != null ? p.medianaMin + ' min' : '—'}</td><td>${p.acepto}</td><td>${p.colocado}</td><td>${p.retraso}</td></tr>`).join('')}</table></div><div class="line">Puntaje 0–100: 40% respuesta, 20% rapidez, 20% aceptación, 20% cumplimiento. Un proveedor sin historial arranca en 50.</div></div>` : '<div class="empty-msg">Aún no hay historial de proveedores.</div>';
      return;
    }
    if (filtro === 'kpis') {
      const k = await api('/api/kpis/sofia');
      cont.innerHTML = `<div class="card"><h3>KPIs de hoy</h3><div class="kpi">${esc(k.texto)}</div><div style="margin-top:16px;"><button class="btn btn-primary" onclick="enviarKpis()">Enviar por email ahora (Diego y Rafael)</button></div><div class="sub" style="margin-top:10px;">Se envían solos todos los días a las 19:00.</div></div>`;
      return;
    }
    datos = await api('/api/colocaciones');
    const lista = datos.filter(c => c.estado === filtro);
    cont.innerHTML = lista.length ? lista.map(tarjeta).join('') : '<div class="empty-msg">Nada por aquí por ahora.</div>';
  } catch (e) { cont.innerHTML = `<div class="empty-msg">No se pudo cargar: ${esc(e.message)}</div>`; }
}
async function aprobar(folio, tel, nombre, precio) {
  if (!confirm(`¿Colocar el folio ${folio} con ${nombre}${precio ? ' a ' + $(precio) : ''}? SOFIA le avisará por plantilla aprobada.`)) return;
  try { const r = await api('/api/colocaciones/' + encodeURIComponent(folio) + '/aprobar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tel }) }); alert(r.mensajeAlGanador ? 'Listo. Se le avisó al proveedor.' : 'Listo. (No se pudo mandar el aviso al proveedor — avísale tú.)'); render(); }
  catch (e) { alert('No se pudo: ' + e.message); }
}
async function manual(folio) {
  const nombre = document.getElementById('m-' + folio).value.trim();
  if (!nombre) return alert('Escribe el nombre del proveedor');
  if (!confirm(`¿Marcar el folio ${folio} como colocado con ${nombre}? (No se le manda ningún mensaje.)`)) return;
  try { await api('/api/colocaciones/' + encodeURIComponent(folio) + '/aprobar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ manual: nombre }) }); render(); }
  catch (e) { alert('No se pudo: ' + e.message); }
}
async function enviarKpis() {
  if (!confirm('¿Enviar los KPIs de hoy por email a Diego y Rafael?')) return;
  try { await api('/api/kpis/sofia/enviar', { method:'POST' }); alert('Enviado.'); } catch (e) { alert('No se pudo: ' + e.message); }
}
document.querySelectorAll('#segF .filter').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#segF .filter').forEach(x => x.classList.remove('on')); b.classList.add('on'); filtro = b.dataset.f; render();
}));
render(); setInterval(() => { if (filtro !== 'kpis') render(); }, 20000);
</script>
</body>
</html>
