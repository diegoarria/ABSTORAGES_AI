<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Historial de Conversaciones — ABSTORAGES</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<style>
/* Alias hacia los tokens corporativos de design-system.css */
:root {
  --h-bg:   var(--ink-950);
  --h-s1:   var(--ink-900);
  --h-s2:   var(--ink-800);
  --h-s3:   var(--ink-700);
  --h-acc:  var(--brand-blue);
  --h-grn:  var(--brand-green);
  --h-amb:  var(--warn);
  --h-red:  var(--critical);
  --h-t1:   var(--text-100);
  --h-t2:   var(--text-300);
  --h-t3:   var(--text-500);
  --h-b1:   var(--line);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--h-bg); color: var(--h-t1); font-family: var(--font-sans); min-height: 100vh; }

.hdr { display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--h-s1); border-bottom:1px solid var(--h-b1); position:sticky; top:0; z-index:50; }
.hdr-logo { font-weight:800; font-size:15px; letter-spacing:-.02em; color:var(--h-t1); display:flex; align-items:center; gap:8px; }
.hdr-logo span { color:var(--h-acc); }
.hdr-nav { display:flex; gap:4px; margin-left:auto; }
.hn { background:none; border:none; color:var(--h-t2); font-size:13px; font-weight:500; padding:7px 14px; border-radius:8px; cursor:pointer; transition:all .15s; }
.hn:hover, .hn.on { background:rgba(47,111,237,.12); color:var(--h-acc); }

.wrap { display:flex; height:calc(100vh - 57px); }
.sidebar { width:340px; border-right:1px solid var(--h-b1); display:flex; flex-direction:column; flex-shrink:0; }
.main { flex:1; overflow-y:auto; padding:24px; }

.search-panel { padding:16px; border-bottom:1px solid var(--h-b1); display:flex; flex-direction:column; gap:10px; }
.search-panel input {
  background: var(--h-s2); border:1px solid var(--h-b1); border-radius:8px;
  color:var(--h-t1); font-size:13px; padding:9px 12px; outline:none; width:100%;
}
.search-panel input:focus { border-color:var(--h-acc); }
.count { font-size:11px; color:var(--h-t3); }

.sess-list { flex:1; overflow-y:auto; padding:6px; }
.sess-item {
  padding:11px 12px; border-radius:10px; cursor:pointer; margin-bottom:4px;
  border:1px solid transparent; transition:background .12s;
}
.sess-item:hover { background:var(--h-s2); }
.sess-item.on { background:rgba(47,111,237,.1); border-color:rgba(47,111,237,.35); }
.sess-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:3px; }
.sess-name { font-size:13px; font-weight:700; color:var(--h-t1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess-badge { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:4px; flex-shrink:0; }
.b-sara   { background:var(--brand-green-dim); color:var(--brand-green-light); }
.b-sofia  { background:var(--brand-blue-dim);  color:var(--brand-blue-light); }
.b-noa    { background:var(--warn-dim);        color:var(--warn); }
.b-hector { background:rgba(168,85,247,.15); color:#a855f7; }
.b-grupo  { background:rgba(255,255,255,.1); color:var(--h-t2); }
.b-desconocido { background:rgba(255,255,255,.08); color:var(--h-t3); }
.sess-meta { font-size:11px; color:var(--h-t3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess-date { font-size:11px; color:var(--h-t3); margin-top:3px; }

.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; color:var(--h-t3); gap:8px; }
.empty-icon { font-size:40px; opacity:.5; margin-bottom:6px; }

.chat-header { display:flex; align-items:center; gap:12px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--h-b1); }
.chat-title { font-size:17px; font-weight:800; }
.chat-sub { font-size:12px; color:var(--h-t3); margin-top:2px; }

.msg { max-width:70%; margin-bottom:14px; display:flex; flex-direction:column; }
.msg.user { align-items:flex-end; margin-left:auto; }
.msg.assistant { align-items:flex-start; }
.msg-bubble { padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.user .msg-bubble { background:var(--h-acc); color:#fff; border-bottom-right-radius:3px; }
.msg.assistant .msg-bubble { background:var(--h-s2); border:1px solid var(--h-b1); border-bottom-left-radius:3px; }
.msg-time { font-size:11px; color:var(--h-t3); margin-top:4px; padding:0 4px; }

.loading { text-align:center; padding:40px; color:var(--h-t3); font-size:13px; }

.mode-tabs { display:flex; gap:4px; padding:12px 16px 0; }
.mode-tab { flex:1; background:var(--h-s2); border:1px solid var(--h-b1); color:var(--h-t2); font-size:12px; font-weight:700; padding:8px; border-radius:8px; cursor:pointer; transition:all .12s; }
.mode-tab.on { background:rgba(47,111,237,.14); border-color:rgba(47,111,237,.4); color:var(--h-acc); }

.agent-filters { display:flex; gap:6px; padding:12px 16px 0; }
.af-chip { background:var(--h-s2); border:1px solid var(--h-b1); color:var(--h-t3); font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; cursor:pointer; transition:all .12s; opacity:.55; }
.af-chip[data-ag="sara"].on  { background:var(--brand-green-dim); border-color:var(--brand-green); color:var(--brand-green-light); opacity:1; }
.af-chip[data-ag="sofia"].on { background:var(--brand-blue-dim);  border-color:var(--brand-blue);  color:var(--brand-blue-light); opacity:1; }
.af-chip[data-ag="noa"].on   { background:var(--warn-dim);        border-color:var(--warn);        color:var(--warn); opacity:1; }

.call-resumen { background:var(--h-s2); border:1px solid var(--h-b1); border-radius:10px; padding:14px 16px; margin-bottom:18px; font-size:13.5px; line-height:1.6; color:var(--h-t1); }
.call-resumen-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--h-t3); margin-bottom:6px; }
.call-transcript { background:var(--h-s1); border:1px solid var(--h-b1); border-radius:10px; padding:14px 16px; font-size:12.5px; line-height:1.7; color:var(--h-t2); white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🗂️ <span>Historial</span> de Conversaciones</div>
  <nav class="hdr-nav">
    <button class="hn" onclick="location.href='/'">Portal</button>
    <button class="hn" onclick="location.href='/ops-center.html'">Ops Center</button>
    <button class="hn" onclick="location.href='/prospector.html'">Prospector</button>
    <button class="hn" onclick="location.href='/memoria-agentes.html'">Memoria</button>
  </nav>
</header>

<div class="wrap">
  <aside class="sidebar">
    <div class="mode-tabs">
      <button class="mode-tab on" id="tab-chats" onclick="cambiarModo('chats')">💬 Chats</button>
      <button class="mode-tab" id="tab-llamadas" onclick="cambiarModo('llamadas')">📞 Llamadas</button>
    </div>
    <div class="agent-filters" id="agent-filters">
      <button class="af-chip on" data-ag="sara" onclick="toggleFiltroAgente('sara')">SARA</button>
      <button class="af-chip on" data-ag="sofia" onclick="toggleFiltroAgente('sofia')">SOFÍA</button>
      <button class="af-chip on" data-ag="noa" onclick="toggleFiltroAgente('noa')">NOA</button>
    </div>
    <div class="search-panel">
      <input id="buscador" type="text" placeholder="Buscar por nombre, empresa, teléfono…" oninput="MODO === 'chats' ? buscar(this.value) : buscarLlamadas(this.value)">
      <div class="count" id="contador"></div>
    </div>
    <div class="sess-list" id="sess-list">
      <div class="loading">Cargando conversaciones…</div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <div class="empty-icon">💬</div>
      <h3>Selecciona una conversación</h3>
      <p>Elige un chat de la lista para ver el historial completo.</p>
    </div>
  </main>
</div>

<script>
let TODAS = [];
let sesionActual = null;
let _debounce = null;
let MODO = 'chats'; // 'chats' | 'llamadas'
let LLAMADAS = [];
let llamadaActual = null;

const AGENTE_LABEL = { sara:'SARA', sofia:'SOFÍA', noa:'NOA', hector:'HÉCTOR', grupo:'GRUPO WA', desconocido:'?' };
const AGENTES_FILTRABLES = ['sara', 'sofia', 'noa'];

// Filtro de agente en modo Chats — las 3 activas por default.
// No se permite dejar todas apagadas, para no mostrar una lista vacía sin sentido.
let FILTRO_AGENTES = new Set(AGENTES_FILTRABLES);

function toggleFiltroAgente(agente) {
  if (FILTRO_AGENTES.has(agente)) {
    if (FILTRO_AGENTES.size === 1) return; // no dejar todas apagadas
    FILTRO_AGENTES.delete(agente);
  } else {
    FILTRO_AGENTES.add(agente);
  }
  document.querySelector(`.af-chip[data-ag="${agente}"]`).classList.toggle('on', FILTRO_AGENTES.has(agente));
  const q = document.getElementById('buscador').value.trim();
  if (q) buscar(q); else render(TODAS);
}

function aplicarFiltroAgente(lista) {
  // Otros agentes (HÉCTOR, grupo de WhatsApp, desconocido) no aplican a este
  // filtro — solo SARA/SOFIA/NOA se pueden aislar aquí, el resto siempre se
  // muestra si aparece (un hilo de grupo puede mezclar a más de un agente).
  return lista.filter(s => !AGENTES_FILTRABLES.includes(s.agente) || FILTRO_AGENTES.has(s.agente));
}

function cambiarModo(m) {
  MODO = m;
  document.getElementById('tab-chats').classList.toggle('on', m === 'chats');
  document.getElementById('tab-llamadas').classList.toggle('on', m === 'llamadas');
  document.getElementById('agent-filters').style.display = m === 'chats' ? 'flex' : 'none';
  document.getElementById('buscador').value = '';
  document.getElementById('main').innerHTML = `
    <div class="empty">
      <div class="empty-icon">${m === 'chats' ? '💬' : '📞'}</div>
      <h3>Selecciona ${m === 'chats' ? 'una conversación' : 'una llamada'}</h3>
      <p>Elige ${m === 'chats' ? 'un chat' : 'una llamada'} de la lista para ver el detalle completo.</p>
    </div>`;
  if (m === 'chats') { render(TODAS); }
  else { cargarLlamadas(); }
}

async function cargarLlamadas() {
  document.getElementById('sess-list').innerHTML = '<div class="loading">Cargando llamadas…</div>';
  try {
    const r = await fetch('/api/vapi/llamadas?limit=300', { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    LLAMADAS = await r.json();
    renderLlamadas(LLAMADAS);
  } catch (e) {
    document.getElementById('sess-list').innerHTML =
      '<div class="loading">No se pudo cargar el historial de llamadas (' + e.message + ')</div>';
  }
}

function renderLlamadas(lista) {
  const list = document.getElementById('sess-list');
  const contador = document.getElementById('contador');
  contador.textContent = lista.length + ' llamada' + (lista.length === 1 ? '' : 's');

  if (!lista.length) {
    list.innerHTML = '<div class="loading">Sin llamadas registradas</div>';
    return;
  }

  list.innerHTML = lista.map(c => {
    const nombre = c.nombre || c.telefono || 'Contacto';
    const activa = c.id === llamadaActual ? 'on' : '';
    const dur = c.duracionSeg ? Math.round(c.duracionSeg) + 's' : '';
    const meta = [c.folio, c.telefono, dur].filter(Boolean).join(' · ');
    return `<div class="sess-item ${activa}" onclick="abrirLlamada('${c.id.replace(/'/g,"\\'")}')">
      <div class="sess-top">
        <div class="sess-name">${esc(nombre)}</div>
        <span class="sess-badge b-${c.agente}">${AGENTE_LABEL[c.agente] || c.agente}</span>
      </div>
      <div class="sess-meta">${esc(meta || 'Sin datos')}</div>
      <div class="sess-date">${fmtFecha(c.timestamp)}</div>
    </div>`;
  }).join('');
}

function buscarLlamadas(q) {
  if (!q.trim()) { renderLlamadas(LLAMADAS); return; }
  const ql = q.trim().toLowerCase();
  renderLlamadas(LLAMADAS.filter(c =>
    (c.nombre||'').toLowerCase().includes(ql) ||
    (c.telefono||'').toLowerCase().includes(ql) ||
    (c.folio||'').toLowerCase().includes(ql) ||
    (c.transcript||'').toLowerCase().includes(ql)
  ));
}

function abrirLlamada(id) {
  llamadaActual = id;
  renderLlamadas(LLAMADAS);
  const c = LLAMADAS.find(x => x.id === id);
  const main = document.getElementById('main');
  if (!c) { main.innerHTML = '<div class="loading">Llamada no encontrada</div>'; return; }

  const dur = c.duracionSeg ? `${Math.round(c.duracionSeg / 60 * 10) / 10} min` : '—';
  main.innerHTML = `
    <div class="chat-header">
      <div>
        <div class="chat-title">${esc(c.nombre || c.telefono || 'Contacto')}</div>
        <div class="chat-sub">${AGENTE_LABEL[c.agente] || c.agente} · ${esc(c.telefono || '')} · ${dur} · ${fmtFecha(c.timestamp)}${c.folio ? ' · Folio ' + esc(c.folio) : ''}</div>
      </div>
    </div>
    ${c.resumen ? `<div class="call-resumen"><div class="call-resumen-label">Resumen de la llamada</div>${esc(c.resumen)}</div>` : ''}
    <div class="call-transcript">${c.transcript ? esc(c.transcript) : 'Sin transcripción disponible.'}</div>
  `;
}

async function cargarSesiones() {
  try {
    const r = await fetch('/api/historial/sesiones', { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    TODAS = await r.json();
    render(TODAS);
  } catch (e) {
    document.getElementById('sess-list').innerHTML =
      '<div class="loading">No se pudo cargar el historial (' + e.message + ')</div>';
  }
}

function buscar(q) {
  clearTimeout(_debounce);
  _debounce = setTimeout(async () => {
    if (!q.trim()) { render(TODAS); return; }
    try {
      const r = await fetch('/api/historial/sesiones?q=' + encodeURIComponent(q.trim()), { credentials:'include' });
      render(await r.json());
    } catch {}
  }, 250);
}

function fmtFecha(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(lista) {
  lista = aplicarFiltroAgente(lista);
  const list = document.getElementById('sess-list');
  const contador = document.getElementById('contador');
  contador.textContent = lista.length + ' conversaci' + (lista.length === 1 ? 'ón' : 'ones');

  if (!lista.length) {
    list.innerHTML = '<div class="loading">Sin resultados</div>';
    return;
  }

  list.innerHTML = lista.map(s => {
    const nombre = s.nombre || s.empresa || s.sessionId;
    // En grupo no hay un solo teléfono — se listan las personas que
    // escribieron (nombre + número de cada una) en vez de un solo dato.
    const participantesTxt = (!s.telefono && s.participantes && s.participantes.length)
      ? s.participantes.map(p => p.nombre && p.nombre !== p.telefono ? `${p.nombre} (${p.telefono})` : (p.telefono || p.nombre)).join(', ')
      : '';
    const meta = [s.empresa && s.empresa !== s.nombre ? s.empresa : '', s.telefono, participantesTxt, s.resumen].filter(Boolean).join(' · ');
    const activa = s.sessionId === sesionActual ? 'on' : '';
    return `<div class="sess-item ${activa}" onclick="abrir('${s.sessionId.replace(/'/g,"\\'")}')">
      <div class="sess-top">
        <div class="sess-name">${esc(nombre)}</div>
        <span class="sess-badge b-${s.agente}">${AGENTE_LABEL[s.agente] || s.agente}</span>
      </div>
      <div class="sess-meta">${esc(meta || (s.msgs + ' mensajes'))}</div>
      <div class="sess-date">${fmtFecha(s.updatedAt)} · ${s.msgs} msj</div>
    </div>`;
  }).join('');
}

async function abrir(sessionId) {
  sesionActual = sessionId;
  render(document.getElementById('buscador').value.trim() ? TODAS.filter(matchLocal) : TODAS);
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Cargando conversación…</div>';

  try {
    const r = await fetch('/api/historial/sesiones/' + encodeURIComponent(sessionId), { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const info = TODAS.find(s => s.sessionId === sessionId) || {};
    const participantesTxt = (!info.telefono && info.participantes && info.participantes.length)
      ? info.participantes.map(p => p.nombre && p.nombre !== p.telefono ? `${p.nombre} (${p.telefono})` : (p.telefono || p.nombre)).join(', ')
      : (info.telefono || '');

    main.innerHTML = `
      <div class="chat-header">
        <div>
          <div class="chat-title">${esc(info.nombre || info.empresa || sessionId)}</div>
          <div class="chat-sub">${AGENTE_LABEL[data.agente] || data.agente} · ${data.historial.length} mensajes${participantesTxt ? ' · ' + esc(participantesTxt) : ''}</div>
        </div>
      </div>
      <div id="msgs"></div>
    `;
    const msgs = document.getElementById('msgs');
    msgs.innerHTML = data.historial.map(m => `
      <div class="msg ${m.role === 'user' ? 'user' : 'assistant'}">
        <div class="msg-bubble">${esc(m.content)}</div>
        <div class="msg-time">${fmtFecha(m.ts)}</div>
      </div>
    `).join('');
  } catch (e) {
    main.innerHTML = '<div class="loading">No se pudo cargar la conversación (' + e.message + ')</div>';
  }
}

function matchLocal(s) { return true; } // placeholder, el filtrado real ya llegó del server

cargarSesiones();
</script>
</body>
</html>
