<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Historial de Conversaciones — ABSTORAGES</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/corporate.css">
<script src="/js/shell.js"></script>
<style>
.page-hist { max-width:1600px; margin:0 auto; padding:24px 28px 56px; }
.board { grid-template-columns:420px minmax(0,1fr); }
.list-panel { max-height:calc(100vh - 100px); }
.detail { min-height:calc(100vh - 100px); }
.chips-row { display:flex; gap:8px; flex-wrap:wrap; }
.af-chip { font-family:inherit; font-size:12px; font-weight:700; padding:6px 13px; border-radius:20px; border:1px solid var(--bd-strong); background:var(--surface); color:var(--tx3); cursor:pointer; transition:all .15s; letter-spacing:.02em; }
.af-chip:hover { color:var(--tx); }
.af-chip[data-ag="sara"].on  { background:var(--sara-soft); border-color:var(--sara); color:var(--sara); }
.af-chip[data-ag="sofia"].on { background:var(--sofia-soft); border-color:var(--sofia); color:var(--sofia); }
.af-chip[data-ag="noa"].on   { background:var(--noa-soft); border-color:var(--noa); color:var(--noa); }
.count { font-size:12px; color:var(--tx3); }
.av-ag-sara { background:var(--sara-soft); color:var(--sara); } .av-ag-sofia { background:var(--sofia-soft); color:var(--sofia); } .av-ag-noa { background:var(--noa-soft); color:var(--noa); }
.av-ag-hector { background:rgba(124,58,237,.12); color:#7C3AED; } .av-ag-grupo, .av-ag-desconocido { background:var(--surface-3); color:var(--tx2); }
.av .i { width:18px; height:18px; }
.ag-sara { background:var(--sara-soft); color:var(--sara); } .ag-sofia { background:var(--sofia-soft); color:var(--sofia); } .ag-noa { background:var(--noa-soft); color:var(--noa); }
.ag-hector { background:rgba(124,58,237,.12); color:#7C3AED; } .ag-grupo, .ag-desconocido { background:var(--surface-3); color:var(--tx2); }
.pill-neutral { background:var(--surface-3); color:var(--tx2); }
.row-meta { justify-content:space-between; }
.row-meta .tel { font-family:inherit; }
.icon-btn { background:none; border:none; color:var(--tx3); width:28px; height:28px; border-radius:7px; display:grid; place-items:center; cursor:pointer; transition:background .15s,color .15s; }
.icon-btn:hover { background:var(--crit-soft); color:var(--crit); }
.icon-btn .i { width:15px; height:15px; }
.btn-danger-o:hover:not(:disabled) { border-color:var(--crit); color:var(--crit); background:var(--crit-soft); }
.blank { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; min-height:420px; color:var(--tx3); padding:20px; }
.blank .i { width:36px; height:36px; opacity:.5; }
.blank h3 { font-size:16px; color:var(--tx); font-weight:700; margin-top:6px; }
.thread { display:flex; flex-direction:column; gap:18px; }
.msg { display:flex; flex-direction:column; max-width:74%; }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.assistant { align-self:flex-start; align-items:flex-start; }
.msg-who { font-size:11px; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.07em; margin-bottom:5px; }
.msg-bubble { padding:12px 16px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.msg.user .msg-bubble { background:var(--acc); color:#fff; border-bottom-right-radius:4px; }
:root[data-theme="dark"] .msg.user .msg-bubble { color:#08111F; }
.msg.assistant .msg-bubble { background:var(--surface-2); border:1px solid var(--bd); border-bottom-left-radius:4px; }
.msg-time { font-size:11.5px; color:var(--tx3); margin-top:5px; }
.transcript { background:var(--surface-2); border:1px solid var(--bd); border-radius:12px; padding:18px 20px; font-size:13.5px; line-height:1.8; color:var(--tx2); white-space:pre-wrap; word-break:break-word; }
@media (max-width:1100px) { .board { grid-template-columns:1fr; } .list-panel { max-height:460px; position:static; } .msg { max-width:92%; } }
</style>
</head>
<body data-shell-title="Historial de conversaciones">

<main class="page-hist">
  <div class="crumbs"><a href="/">Portal</a><span>/</span><span>Historial</span></div>
  <div class="page-head">
    <div>
      <h1>Historial de conversaciones</h1>
      <p>Todos los chats y llamadas de SARA, SOFIA y NOA, con el detalle completo de cada interacción.</p>
    </div>
  </div>

  <div class="board">
    <section class="panel list-panel">
      <div class="toolbar">
        <div class="seg" role="tablist">
          <div class="filter on" id="tab-chats" onclick="cambiarModo('chats')" role="tab">Chats</div>
          <div class="filter" id="tab-llamadas" onclick="cambiarModo('llamadas')" role="tab">Llamadas</div>
        </div>
        <div class="chips-row" id="agent-filters">
          <button class="af-chip on" data-ag="sara" onclick="toggleFiltroAgente('sara')">SARA</button>
          <button class="af-chip on" data-ag="sofia" onclick="toggleFiltroAgente('sofia')">SOFÍA</button>
          <button class="af-chip on" data-ag="noa" onclick="toggleFiltroAgente('noa')">NOA</button>
        </div>
        <div class="search-w"><span id="searchIco"></span><input class="search" id="buscador" type="text" placeholder="Buscar por nombre, empresa o teléfono" aria-label="Buscar" oninput="MODO === 'chats' ? buscar(this.value) : buscarLlamadas(this.value)"></div>
        <div class="count" id="contador"></div>
      </div>
      <div class="list" id="sess-list"><div class="empty-msg">Cargando conversaciones…</div></div>
    </section>

    <section class="panel detail" id="main"></section>
  </div>
</main>

<script>
let TODAS = [];
let sesionActual = null;
let _debounce = null;
let MODO = 'chats'; // 'chats' | 'llamadas'
let LLAMADAS = [];
let llamadaActual = null;

const AGENTE_LABEL = { sara:'SARA', sofia:'SOFÍA', noa:'NOA', hector:'HÉCTOR', grupo:'GRUPO WA', desconocido:'?' };
const AGENTES_FILTRABLES = ['sara', 'sofia', 'noa'];

// Filtro de agente en modo Chats — las 3 activas por default.
// No se permite dejar todas apagadas, para no mostrar una lista vacía sin sentido.
let FILTRO_AGENTES = new Set(AGENTES_FILTRABLES);

function toggleFiltroAgente(agente) {
  if (FILTRO_AGENTES.has(agente)) {
    if (FILTRO_AGENTES.size === 1) return; // no dejar todas apagadas
    FILTRO_AGENTES.delete(agente);
  } else {
    FILTRO_AGENTES.add(agente);
  }
  document.querySelector(`.af-chip[data-ag="${agente}"]`).classList.toggle('on', FILTRO_AGENTES.has(agente));
  const q = document.getElementById('buscador').value.trim();
  if (q) buscar(q); else render(TODAS);
}

function aplicarFiltroAgente(lista) {
  // Otros agentes (HÉCTOR, grupo de WhatsApp, desconocido) no aplican a este
  // filtro — solo SARA/SOFIA/NOA se pueden aislar aquí, el resto siempre se
  // muestra si aparece (un hilo de grupo puede mezclar a más de un agente).
  return lista.filter(s => !AGENTES_FILTRABLES.includes(s.agente) || FILTRO_AGENTES.has(s.agente));
}

function vacioDetalle(m) {
  return `<div class="blank">${ico(m === 'chats' ? 'chat' : 'phone')}<h3>Selecciona ${m === 'chats' ? 'una conversación' : 'una llamada'}</h3><p>Elige ${m === 'chats' ? 'un chat' : 'una llamada'} de la lista para ver el detalle completo.</p></div>`;
}
function iniciales(n) { const p = String(n || '?').trim().split(/\s+/).filter(Boolean); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }

function cambiarModo(m) {
  MODO = m;
  document.getElementById('tab-chats').classList.toggle('on', m === 'chats');
  document.getElementById('tab-llamadas').classList.toggle('on', m === 'llamadas');
  document.getElementById('agent-filters').style.display = m === 'chats' ? 'flex' : 'none';
  document.getElementById('buscador').value = '';
  document.getElementById('main').innerHTML = vacioDetalle(m);
  if (m === 'chats') { render(TODAS); }
  else { cargarLlamadas(); }
}

async function cargarLlamadas() {
  document.getElementById('sess-list').innerHTML = '<div class="empty-msg">Cargando llamadas…</div>';
  try {
    const r = await fetch('/api/vapi/llamadas?limit=300', { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    LLAMADAS = await r.json();
    renderLlamadas(LLAMADAS);
  } catch (e) {
    document.getElementById('sess-list').innerHTML =
      '<div class="empty-msg">No se pudo cargar el historial de llamadas (' + e.message + ')</div>';
  }
}

function renderLlamadas(lista) {
  const list = document.getElementById('sess-list');
  const contador = document.getElementById('contador');
  contador.textContent = lista.length + ' llamada' + (lista.length === 1 ? '' : 's');

  if (!lista.length) {
    list.innerHTML = '<div class="empty-msg">Sin llamadas registradas</div>';
    return;
  }

  list.innerHTML = lista.map(c => {
    const nombre = c.nombre || c.telefono || 'Contacto';
    const activa = c.id === llamadaActual ? 'on' : '';
    const dur = c.duracionSeg ? Math.round(c.duracionSeg) + 's' : '';
    const meta = [c.folio, c.telefono, dur].filter(Boolean).join(' · ');
    return `<div class="row ${activa ? 'sel' : ''}" onclick="abrirLlamada('${c.id.replace(/'/g,"\\'")}')">
      <div class="av av-ag-${c.agente}">${ico('phone')}</div>
      <div class="row-main">
        <div class="row-top"><div class="nombre">${esc(nombre)}</div><span class="tipo-tag ag-${c.agente}">${AGENTE_LABEL[c.agente] || c.agente}</span></div>
        <div class="empresa">${esc(meta || 'Sin datos')}</div>
        <div class="row-meta"><span class="tel">${fmtFecha(c.timestamp)}</span></div>
      </div>
    </div>`;
  }).join('');
}

function buscarLlamadas(q) {
  if (!q.trim()) { renderLlamadas(LLAMADAS); return; }
  const ql = q.trim().toLowerCase();
  renderLlamadas(LLAMADAS.filter(c =>
    (c.nombre||'').toLowerCase().includes(ql) ||
    (c.telefono||'').toLowerCase().includes(ql) ||
    (c.folio||'').toLowerCase().includes(ql) ||
    (c.transcript||'').toLowerCase().includes(ql)
  ));
}

function abrirLlamada(id) {
  llamadaActual = id;
  renderLlamadas(LLAMADAS);
  const c = LLAMADAS.find(x => x.id === id);
  const main = document.getElementById('main');
  if (!c) { main.innerHTML = '<div class="empty-msg">Llamada no encontrada</div>'; return; }

  const dur = c.duracionSeg ? `${Math.round(c.duracionSeg / 60 * 10) / 10} min` : '—';
  main.innerHTML = `
    <div class="d-head">
      <div class="av av-ag-${c.agente} d-av">${esc(iniciales(c.nombre || c.telefono))}</div>
      <div class="d-id">
        <div class="nombre">${esc(c.nombre || c.telefono || 'Contacto')}</div>
        <div class="empresa">${esc(c.telefono || 'Sin teléfono')}</div>
        <div class="d-tags">
          <span class="tipo-tag ag-${c.agente}">${AGENTE_LABEL[c.agente] || c.agente}</span>
          <span class="pill pill-neutral">${ico('clock')} ${dur}</span>
          <span class="pill pill-neutral">${fmtFecha(c.timestamp)}</span>
          ${c.folio ? `<span class="pill pill-neutral">Folio ${esc(c.folio)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="d-body">
      ${c.resumen ? `<section><div class="sec-title">Resumen de la llamada</div><div class="notes">${esc(c.resumen)}</div></section>` : ''}
      <section><div class="sec-title">Transcripción</div><div class="transcript">${c.transcript ? esc(c.transcript) : 'Sin transcripción disponible.'}</div></section>
    </div>
  `;
}

async function cargarSesiones() {
  try {
    const r = await fetch('/api/historial/sesiones', { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    TODAS = await r.json();
    render(TODAS);
  } catch (e) {
    document.getElementById('sess-list').innerHTML =
      '<div class="empty-msg">No se pudo cargar el historial (' + e.message + ')</div>';
  }
}

function buscar(q) {
  clearTimeout(_debounce);
  _debounce = setTimeout(async () => {
    if (!q.trim()) { render(TODAS); return; }
    try {
      const r = await fetch('/api/historial/sesiones?q=' + encodeURIComponent(q.trim()), { credentials:'include' });
      render(await r.json());
    } catch {}
  }, 250);
}

function fmtFecha(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(lista) {
  lista = aplicarFiltroAgente(lista);
  const list = document.getElementById('sess-list');
  const contador = document.getElementById('contador');
  contador.textContent = lista.length + ' conversaci' + (lista.length === 1 ? 'ón' : 'ones');

  if (!lista.length) {
    list.innerHTML = '<div class="empty-msg">Sin resultados</div>';
    return;
  }

  list.innerHTML = lista.map(s => {
    const nombre = s.nombre || s.empresa || s.sessionId;
    // En grupo no hay un solo teléfono — se listan las personas que
    // escribieron (nombre + número de cada una) en vez de un solo dato.
    const participantesTxt = (!s.telefono && s.participantes && s.participantes.length)
      ? s.participantes.map(p => p.nombre && p.nombre !== p.telefono ? `${p.nombre} (${p.telefono})` : (p.telefono || p.nombre)).join(', ')
      : '';
    const meta = [s.empresa && s.empresa !== s.nombre ? s.empresa : '', s.telefono, participantesTxt, s.resumen].filter(Boolean).join(' · ');
    const activa = s.sessionId === sesionActual ? 'on' : '';
    const sidEsc = s.sessionId.replace(/'/g,"\\'");
    return `<div class="row ${activa ? 'sel' : ''}" onclick="abrir('${sidEsc}')">
      <div class="av av-ag-${s.agente}">${esc(iniciales(nombre))}</div>
      <div class="row-main">
        <div class="row-top"><div class="nombre">${esc(nombre)}</div><span class="tipo-tag ag-${s.agente}">${AGENTE_LABEL[s.agente] || s.agente}</span></div>
        <div class="empresa">${esc(meta || (s.msgs + ' mensajes'))}</div>
        <div class="row-meta"><span class="tel">${fmtFecha(s.updatedAt)} · ${s.msgs} msj</span><button class="icon-btn" title="Borrar conversación" aria-label="Borrar conversación" onclick="event.stopPropagation(); borrarSesion('${sidEsc}')">${ico('trash')}</button></div>
      </div>
    </div>`;
  }).join('');
}

async function abrir(sessionId) {
  sesionActual = sessionId;
  render(document.getElementById('buscador').value.trim() ? TODAS.filter(matchLocal) : TODAS);
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty-msg">Cargando conversación…</div>';

  try {
    const r = await fetch('/api/historial/sesiones/' + encodeURIComponent(sessionId), { credentials:'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const info = TODAS.find(s => s.sessionId === sessionId) || {};
    const participantesTxt = (!info.telefono && info.participantes && info.participantes.length)
      ? info.participantes.map(p => p.nombre && p.nombre !== p.telefono ? `${p.nombre} (${p.telefono})` : (p.telefono || p.nombre)).join(', ')
      : (info.telefono || '');

    main.innerHTML = `
      <div class="d-head">
        <div class="av av-ag-${data.agente} d-av">${esc(iniciales(info.nombre || info.empresa || sessionId))}</div>
        <div class="d-id">
          <div class="nombre">${esc(info.nombre || info.empresa || sessionId)}</div>
          <div class="empresa">${esc(participantesTxt || 'Sin teléfono registrado')}</div>
          <div class="d-tags">
            <span class="tipo-tag ag-${data.agente}">${AGENTE_LABEL[data.agente] || data.agente}</span>
            <span class="pill pill-neutral">${data.historial.length} mensajes</span>
            ${data.ip ? `<span class="pill pill-neutral">IP ${esc(data.ip)}</span>` : ''}
          </div>
        </div>
        <div class="actions"><button class="btn btn-secondary btn-danger-o" onclick="borrarSesion('${sessionId.replace(/'/g,"\\'")}')">${ico('trash')} Borrar conversación</button></div>
      </div>
      <div class="d-body"><div class="thread" id="msgs"></div></div>
    `;
    const msgs = document.getElementById('msgs');
    msgs.innerHTML = data.historial.map(m => `
      <div class="msg ${m.role === 'user' ? 'user' : 'assistant'}">
        <div class="msg-who">${m.role === 'user' ? 'Contacto' : (AGENTE_LABEL[data.agente] || 'Agente')}</div>
        <div class="msg-bubble">${esc(m.content)}</div>
        <div class="msg-time">${fmtFecha(m.ts)}</div>
      </div>
    `).join('');
  } catch (e) {
    main.innerHTML = '<div class="empty-msg">No se pudo cargar la conversación (' + e.message + ')</div>';
  }
}

async function borrarSesion(sessionId) {
  const s = TODAS.find(x => x.sessionId === sessionId);
  const nombre = s ? (s.nombre || s.empresa || sessionId) : sessionId;
  if (!confirm(`¿Borrar la conversación con "${nombre}"?\n\nNo se puede deshacer — se pierde el historial completo de esos mensajes.`)) return;

  try {
    const r = await fetch('/api/historial/sesiones/' + encodeURIComponent(sessionId), { method: 'DELETE', credentials:'include' });
    if (!r.ok) { const d = await r.json().catch(()=>({})); throw new Error(d.error || ('HTTP ' + r.status)); }
    TODAS = TODAS.filter(x => x.sessionId !== sessionId);
    if (sesionActual === sessionId) {
      sesionActual = null;
      document.getElementById('main').innerHTML = vacioDetalle('chats');
    }
    render(document.getElementById('buscador').value.trim() ? TODAS.filter(matchLocal) : TODAS);
  } catch (e) {
    alert('No se pudo borrar: ' + e.message);
  }
}

function matchLocal(s) { return true; } // placeholder, el filtrado real ya llegó del server

document.getElementById('searchIco').innerHTML = ico('search');
document.getElementById('main').innerHTML = vacioDetalle('chats');
cargarSesiones();
</script>
</body>
</html>
