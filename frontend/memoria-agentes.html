<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memoria de Agentes — ABSTORAGES</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/corporate.css">
<script src="/js/shell.js"></script>
</head>
<body data-shell-title="Memoria de agentes">
<main class="page">
  <div class="crumbs"><a href="/">Portal</a><span>/</span><span>Memoria de agentes</span></div>
  <div class="page-head">
    <div>
      <h1>Memoria de agentes</h1>
      <p>Lo que SARA, SOFIA y NOA recuerdan de cada persona: datos de contacto, historial y notas. Es una vista de solo lectura.</p>
      <div class="updated" id="updated"></div>
    </div>
  </div>

  <div class="agents" id="tabs"></div>

  <div class="board">
    <section class="panel list-panel">
      <div class="toolbar">
        <div class="search-w"><span id="searchIco"></span><input class="search" id="searchInput" placeholder="Buscar por nombre, empresa o tipo de carga" aria-label="Buscar contactos"></div>
        <div class="seg">
          <div class="filter" data-tipo="todos" id="f-todos">Todos</div>
          <div class="filter" data-tipo="cliente" id="f-cliente">Clientes</div>
          <div class="filter" data-tipo="proveedor" id="f-proveedor">Proveedores</div>
          <div class="filter" data-tipo="operador" id="f-operador">Operadores</div>
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section class="panel detail" id="detail"></section>
  </div>
</main>

<script>
const AGENTES = {
  SARA:  { role: "Ventas · Clientes",                              color: "var(--sara)",  soft: "var(--sara-soft)" },
  SOFIA: { role: "Operaciones · Proveedores",                      color: "var(--sofia)", soft: "var(--sofia-soft)" },
  NOA:   { role: "Monitoreo · Clientes, proveedores y operadores", color: "var(--noa)",   soft: "var(--noa-soft)" },
};

let activeAgent = "SARA";
let activeTipo = "todos";
let activeContactId = null;
let searchQuery = "";
let contactosCache = [];
let counts = { SARA: 0, SOFIA: 0, NOA: 0 };
let _debounce = null;

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtFecha(iso) { return iso ? new Date(iso).toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function fmtFechaHora(iso) { return iso ? new Date(iso).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—'; }
function tipoLabel(t) { return t==='cliente' ? 'Cliente' : t==='proveedor' ? 'Proveedor' : 'Operador'; }
function iniciales(n) { const p = String(n || '?').trim().split(/\s+/).filter(Boolean); return ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase(); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = Object.entries(AGENTES).map(([key,a])=>`
    <button class="agent ${key===activeAgent?'active':''}" style="--ag:${a.color};--ag-soft:${a.soft}" onclick="selectAgent('${key}')" aria-pressed="${key===activeAgent}">
      <span class="agent-av">${key[0]}</span>
      <span><span class="agent-nm">${key}</span><span class="agent-rl" style="display:block">${a.role}</span></span>
      <span class="agent-ct"><b>${counts[key]}</b><span>contactos</span></span>
    </button>
  `).join('');
}

async function selectAgent(key){
  activeAgent = key; activeTipo = "todos"; activeContactId = null; searchQuery = "";
  document.getElementById('searchInput').value = "";
  renderTabs(); renderFilters();
  await cargarContactos();
}

function renderFilters(){
  ['todos','cliente','proveedor','operador'].forEach(t=>{
    const btn = document.getElementById('f-'+t);
    btn.classList.toggle('on', activeTipo===t);
    btn.onclick = async ()=>{ activeTipo = t; renderFilters(); await cargarContactos(); };
  });
}

async function cargarContactos() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty-msg">Cargando…</div>';
  try {
    const params = new URLSearchParams({ agente: activeAgent });
    if (activeTipo !== 'todos') params.set('tipo', activeTipo);
    if (searchQuery.trim()) params.set('q', searchQuery.trim());
    const r = await fetch('/api/contactos?' + params.toString(), { credentials: 'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    contactosCache = await r.json();
    counts[activeAgent] = contactosCache.length;
    renderTabs();
    renderList();
  } catch (e) {
    list.innerHTML = '<div class="empty-msg">No se pudo cargar (' + esc(e.message) + ')</div>';
  }
}

function renderList(){
  const list = document.getElementById('list');
  if (contactosCache.length === 0) {
    list.innerHTML = '<div class="empty-msg">Sin resultados para este filtro.</div>';
    document.getElementById('detail').innerHTML = '';
    return;
  }
  if (!activeContactId || !contactosCache.find(c=>c.id===activeContactId)) activeContactId = contactosCache[0].id;
  list.innerHTML = contactosCache.map(c=>`
    <div class="row ${c.id===activeContactId?'sel':''}" onclick="selectContacto('${c.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')selectContacto('${c.id}')">
      <div class="av av-${c.tipo}">${esc(iniciales(c.nombre_completo))}</div>
      <div class="row-main">
        <div class="row-top"><div class="nombre">${esc(c.nombre_completo)}</div><div class="fecha">${fmtFecha(c.fecha_ultimo_contacto)}</div></div>
        <div class="empresa">${esc([c.puesto, c.empresa].filter(Boolean).join(' · ') || '—')}</div>
        <div class="row-meta"><span class="tipo-tag tipo-${c.tipo}">${tipoLabel(c.tipo)}</span><span class="tel">${esc(c.telefono || '—')}</span></div>
      </div>
    </div>
  `).join('');
  renderDetail();
}

function selectContacto(id){ activeContactId = id; renderList(); }

async function renderDetail(){
  const agent = AGENTES[activeAgent];
  const c = contactosCache.find(x=>x.id===activeContactId);
  const detail = document.getElementById('detail');
  if(!c){ detail.innerHTML = ''; return; }
  detail.innerHTML = '<div class="empty-msg">Cargando ficha…</div>';

  let data;
  try {
    const r = await fetch('/api/contactos/' + encodeURIComponent(c.id), { credentials: 'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    detail.innerHTML = '<div class="empty-msg">No se pudo cargar el detalle (' + esc(e.message) + ')</div>';
    return;
  }

  detail.innerHTML = `
    <div class="d-head">
      <div class="av av-${data.tipo} d-av">${esc(iniciales(data.nombre_completo))}</div>
      <div class="d-id">
        <div class="nombre">${esc(data.nombre_completo)}</div>
        ${data.puesto ? `<div class="puesto">${esc(data.puesto)}</div>` : ''}
        <div class="empresa">${esc(data.empresa || 'Sin empresa registrada')}</div>
        <div class="d-tags">
          <span class="tipo-tag tipo-${data.tipo}">${tipoLabel(data.tipo)}</span>
          <span class="agent-badge" style="background:${agent.soft};color:${agent.color}">Asignado a ${esc(data.agente_asignado)}</span>
        </div>
      </div>
    </div>
    <div class="d-body">
      <section>
        <div class="sec-title">Información de contacto</div>
        <div class="fields">
          <div class="field"><label>Teléfono</label><div class="val mono">${esc(data.telefono || '—')}</div></div>
          <div class="field"><label>Correo electrónico</label><div class="val">${esc(data.email || '—')}</div></div>
          <div class="field"><label>Mercancía habitual</label><div class="val">${esc(data.tipo_carga || '—')}</div></div>
          <div class="field"><label>Clasificación</label><div class="val">${tipoLabel(data.tipo)}</div></div>
          <div class="field"><label>Primer contacto</label><div class="val">${fmtFecha(data.fecha_primer_contacto)}</div></div>
          <div class="field"><label>Último contacto</label><div class="val">${fmtFecha(data.fecha_ultimo_contacto)}</div></div>
        </div>
      </section>
      ${data.notas ? `<section><div class="sec-title">Notas</div><div class="notes">${esc(data.notas)}</div></section>` : ''}
      <section>
        <div class="sec-title">Bitácora de interacciones <span class="cnt">${data.interacciones.length}</span></div>
        ${data.interacciones.length ? `<div class="tl">${data.interacciones.map(e=>`
          <div class="evento">
            <div class="fecha">${fmtFechaHora(e.fecha)}</div>
            <div><span class="canal">${esc(e.agente)} · ${esc(e.canal || 'otro')}</span></div>
            <div class="resumen">${esc(e.resumen || '—')}</div>
          </div>`).join('')}</div>` : '<div class="empty-msg">Sin interacciones registradas.</div>'}
      </section>
    </div>
  `;
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  clearTimeout(_debounce);
  _debounce = setTimeout(cargarContactos, 300);
});

document.getElementById('searchIco').innerHTML = ico('search');
document.getElementById('updated').textContent = 'Cargado: ' + new Date().toLocaleString('es-MX', { dateStyle:'medium', timeStyle:'short' });

renderTabs();
renderFilters();
cargarContactos();
</script>
</body>
</html>
