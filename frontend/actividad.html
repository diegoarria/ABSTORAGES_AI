<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Actividad en vivo — ABSTORAGES</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/shell.css">
<link rel="stylesheet" href="/css/corporate.css">
<script src="/js/shell.js"></script>
<style>
.page-w { max-width:1100px; margin:0 auto; padding:24px 28px 56px; }
.live { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--tx2); background:var(--surface); border:1px solid var(--bd); border-radius:20px; padding:6px 13px; box-shadow:var(--shadow-1); }
.dot { width:9px; height:9px; border-radius:50%; background:var(--tx3); }
.dot.on { background:var(--ok); box-shadow:0 0 0 0 rgba(11,125,87,.5); animation:pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(11,125,87,0); } 100% { box-shadow:0 0 0 0 rgba(11,125,87,0); } }
.bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.bar .seg { min-width:320px; }
.hitos { margin-left:auto; }
.feed { background:var(--surface); border:1px solid var(--bd); border-radius:14px; box-shadow:var(--shadow-1); overflow:hidden; }
.ev { display:grid; grid-template-columns:76px 88px 1fr; gap:16px; align-items:start; padding:15px 20px; border-bottom:1px solid var(--bd); position:relative; }
.ev:last-child { border-bottom:none; }
.ev.hito { background:var(--surface-2); }
.ev.hito::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ag); }
.ev .t { font-size:12.5px; color:var(--tx3); font-variant-numeric:tabular-nums; padding-top:3px; }
.ev .who { font-size:11px; font-weight:700; letter-spacing:.06em; padding:4px 10px; border-radius:20px; text-align:center; text-transform:uppercase; background:var(--ag-soft); color:var(--ag); width:fit-content; }
.ev .tipo { display:block; font-size:11px; color:var(--tx3); text-transform:uppercase; letter-spacing:.07em; margin-bottom:3px; font-weight:700; }
.ev .msg { font-size:14px; line-height:1.55; word-break:break-word; }
.a-SARA { --ag:var(--sara); --ag-soft:var(--sara-soft); } .a-SOFIA { --ag:var(--sofia); --ag-soft:var(--sofia-soft); } .a-NOA { --ag:var(--noa); --ag-soft:var(--noa-soft); } .a-OTRO { --ag:var(--tx2); --ag-soft:var(--surface-3); }
@media (max-width:640px) { .page-w { padding:20px 16px 48px; } .ev { grid-template-columns:1fr; gap:6px; } .ev .t { order:3; } .bar .seg { min-width:0; width:100%; } }
</style>
</head>
<body data-shell-title="Actividad en vivo">
<main class="page-w">
  <div class="crumbs"><a href="/">Portal</a><span>/</span><span>En vivo</span></div>
  <div class="page-head">
    <div>
      <h1>Actividad en vivo</h1>
      <p>Cada contacto, respuesta y resultado de SARA, SOFIA y NOA en tiempo real. Los textos los arma el sistema con datos reales.</p>
    </div>
    <div class="live"><span class="dot" id="dot"></span><span id="estado">Conectando…</span></div>
  </div>

  <div class="bar">
    <div class="seg" id="segAg">
      <div class="filter on" data-ag="TODOS">Todos</div>
      <div class="filter" data-ag="SARA">SARA</div>
      <div class="filter" data-ag="SOFIA">SOFIA</div>
      <div class="filter" data-ag="NOA">NOA</div>
    </div>
    <button class="btn btn-secondary btn-sm hitos" id="solo-hitos">Solo hitos</button>
  </div>

  <div class="feed" id="feed"><div class="empty-msg">Esperando actividad…</div></div>
</main>

<script>
const HITOS = new Set(['RECLAMO_PAGO','NUEVA_ORDEN','CONTACTANDO_PROVEEDORES','RESULTADO_CONTACTO','PROVEEDOR_GANADOR','SIN_UNIDAD','FILTRO_RUTA','OFERTA','EN_ESPERA_HORARIO','SEGUIMIENTO_UNIDAD','SUGERENCIA','ALERTA_CRITICA','ALERTA_INTENTO_ATAQUE','ALERTA_FUGA_PROMPT','ALERTA_ABUSO','LLAMADA_TERMINADA']);
const ETIQUETA = {
  CONTACTO_SALIENTE:'Contacto saliente', CONVERSACION_WA:'Conversación', CONTACTANDO_PROVEEDORES:'Búsqueda de unidad', FILTRO_RUTA:'Filtro por ruta',
  OFERTA:'Oferta', RECLAMO_PAGO:'Reclamo de pago', EN_ESPERA_HORARIO:'En espera de horario', SEGUIMIENTO_UNIDAD:'Seguimiento de unidad', SUGERENCIA:'Sugerencia', RECORDATORIO:'Recordatorio', SIN_RESPUESTA:'Sin respuesta',
  RESULTADO_CONTACTO:'Resultado', NUEVA_ORDEN:'Nueva orden', PROVEEDOR_GANADOR:'Proveedor asignado', SIN_UNIDAD:'Sin unidad',
  LLAMADA_TERMINADA:'Llamada terminada', LLAMADA_VIVO:'Llamada en curso', VAPI_INICIADO:'Llamadas iniciadas', VAPI_RESULTADO:'Resultado de llamada',
  DISPONIBILIDAD_DIARIA:'Ronda de disponibilidad', ALERTA_CRITICA:'Alerta crítica', MENSAJE_USUARIO:'Mensaje', MENSAJE_SARA:'Respuesta', MENSAJE_SOFIA:'Respuesta', MENSAJE_NOA:'Respuesta',
};
let eventos = [];
let filtroAg = 'TODOS';
let soloHitos = false;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hora(ts){ try { return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch { return ''; } }
function agClase(a){ a = String(a||'').toUpperCase(); return ['SARA','SOFIA','NOA'].includes(a) ? a : 'OTRO'; }

function render(){
  const feed = document.getElementById('feed');
  const lista = eventos.filter(e => (filtroAg === 'TODOS' || String(e.agente||'').toUpperCase() === filtroAg) && (!soloHitos || HITOS.has(e.tipo)));
  if (!lista.length){ feed.innerHTML = '<div class="empty-msg">Sin actividad para este filtro por ahora.</div>'; return; }
  feed.innerHTML = lista.map(e => {
    const c = agClase(e.agente);
    return `<div class="ev a-${c} ${HITOS.has(e.tipo) ? 'hito' : ''}">
      <div class="t">${esc(hora(e.timestamp))}</div>
      <div><span class="who">${esc(e.agente || '—')}</span></div>
      <div><span class="tipo">${esc(ETIQUETA[e.tipo] || e.tipo || '')}</span><div class="msg">${esc(e.mensaje || '')}</div></div>
    </div>`;
  }).join('');
}

function agregar(e){
  eventos.unshift(e);
  if (eventos.length > 300) eventos.length = 300;
  render();
}

document.querySelectorAll('#segAg .filter').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#segAg .filter').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filtroAg = b.dataset.ag; render();
}));
document.getElementById('solo-hitos').addEventListener('click', e => {
  soloHitos = !soloHitos; e.currentTarget.classList.toggle('btn-primary', soloHitos); e.currentTarget.classList.toggle('btn-secondary', !soloHitos); render();
});

function conectar(){
  const es = new EventSource('/api/actividad/stream');
  es.onopen = () => { document.getElementById('dot').classList.add('on'); document.getElementById('estado').textContent = 'En vivo'; };
  es.onmessage = m => {
    let d; try { d = JSON.parse(m.data); } catch { return; }
    if (d.type === 'historial') { eventos = (d.actividades || []).slice().reverse(); render(); }
    else if (d.type === 'actividad') agregar(d);
  };
  es.onerror = () => {
    es.close();
    document.getElementById('dot').classList.remove('on'); document.getElementById('estado').textContent = 'Reconectando…';
    setTimeout(conectar, 4000);
  };
}
conectar();
</script>
</body>
</html>
